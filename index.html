    --amber-tint:#FBF0DD;
    --violet:#6C4FB6;
    --violet-tint:#EFE9FA;
    --crimson:#B3243C;
    --crimson-tint:#FAE3E7;
    --border:#DDE3EA;
    --shadow: 0 4px 16px rgba(15,25,45,0.06), 0 1px 3px rgba(15,25,45,0.05);
    --font-body:'Inter', system-ui, sans-serif;
    --font-display:'Plus Jakarta Sans', system-ui, sans-serif;
    --font-ar:'Cairo', system-ui, sans-serif;
  }
  html[lang="ar"]{
    --font-body:'Cairo', system-ui, sans-serif;
    --font-display:'Cairo', system-ui, sans-serif;
  }
  /* Auto-applied whenever a saved name/customer value is written in Arabic script,
     regardless of the interface language currently selected. */
  .ar-text{ font-family:'Cairo', system-ui, sans-serif !important; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 90% -10%, var(--primary-tint), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 0;}

  header{margin-bottom:18px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .title-row{display:flex; align-items:center; gap:12px;}
  .logo-img{
    width:52px; height:52px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--primary); box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }
  .title{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--primary-dark);
    margin:0 0 4px;
    line-height:1.2;
    text-transform:uppercase;
  }
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin:0;letter-spacing:0.01em;}

  .lang-switch{
    display:flex; flex-shrink:0; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:3px; box-shadow:var(--shadow); margin-top:2px;
  }
  .lang-switch button{
    border:none; background:transparent; padding:6px 13px; border-radius:16px;
    font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .lang-switch button.active{background:var(--primary); color:#fff;}

  /* search bar */
  .search-bar{
    position:sticky; top:10px; z-index:20;
    display:flex; align-items:center; gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px 14px;
    box-shadow:var(--shadow);
    margin:18px 0 16px;
  }
  .search-bar svg{flex-shrink:0;color:var(--ink-soft);}
  .search-bar input{
    border:none; outline:none; background:transparent;
    font-family:inherit; font-size:15px; color:var(--ink);
    flex:1; width:100%;
  }
  .search-bar input::placeholder{color:#9BA9A0;}

  /* add button + form */
  .add-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px;
    background:var(--primary); color:#fff; border:none; border-radius:14px;
    font-family:inherit; font-size:15.5px; font-weight:600;
    cursor:pointer; box-shadow:var(--shadow);
    transition:background .15s ease, transform .1s ease;
  }
  .add-toggle:hover{background:var(--primary-dark);}
  .add-toggle:active{transform:scale(0.98);}

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:18px; margin-top:12px;
    box-shadow:var(--shadow);
    display:none;
  }
  .panel.open{display:block;}
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:13px; color:var(--ink-soft);
    margin-bottom:5px; font-weight:600;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--border);
    border-radius:10px; font-family:inherit; font-size:14.5px;
    background:#FAFCF9; color:var(--ink); outline:none;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
  .field input[type="url"], .field input[type="tel"]{direction:ltr; text-align:left; font-family:'Inter',sans-serif;}
  .form-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-save{
    flex:1; padding:12px; border:none; border-radius:10px;
    background:var(--primary); color:#fff; font-family:inherit;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn-cancel{
    padding:12px 18px; border:1px solid var(--border); border-radius:10px;
    background:#fff; color:var(--ink-soft); font-family:inherit;
    font-size:15px; cursor:pointer;
  }

  /* stats */
  .stats{display:flex; gap:8px; margin:18px 0 4px;}
  .stat{
    flex:1; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px; text-align:center; box-shadow:var(--shadow);
  }
  .stat .num{font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--primary-dark);}
  .stat .lbl{font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:3px; letter-spacing:0.01em;}

  /* route list */
  .route{position:relative; margin-top:22px;}
  html[dir="rtl"] .route::before{ right:19px; left:auto; }
  html[dir="ltr"] .route::before{ left:19px; right:auto; }
  .route::before{
    content:""; position:absolute; top:8px; bottom:8px;
    width:2px; background-repeat:repeat-y;
    background-image:linear-gradient(var(--border) 60%, transparent 0%);
    background-size:2px 10px;
  }
  .empty{
    text-align:center; color:var(--ink-soft); padding:50px 20px;
    background:var(--surface); border-radius:16px; border:1px dashed var(--border);
  }
  .empty .big{font-size:32px; margin-bottom:8px;}

  .card{
    position:relative; margin-bottom:14px; overflow:hidden;
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px 18px 16px 20px; box-shadow:var(--shadow);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{box-shadow:0 8px 22px rgba(15,25,45,0.09), 0 1px 3px rgba(15,25,45,0.06);}
  html[dir="rtl"] .card{ margin-right:44px; margin-left:0; padding:16px 20px 16px 18px; }
  html[dir="ltr"] .card{ margin-left:44px; margin-right:0; }
  .card::before{
    content:""; position:absolute; top:0; bottom:0; width:4px;
    background:var(--card-accent, var(--primary));
  }
  html[dir="ltr"] .card::before{ left:0; }
  html[dir="rtl"] .card::before{ right:0; }
  .card.status-visit{--card-accent:var(--blue);}
  .card.status-inspection{--card-accent:var(--amber);}
  .card.status-wip{--card-accent:var(--violet);}
  .card.status-workdone{--card-accent:var(--forest);}
  .card.status-contract{--card-accent:var(--teal);}
  .card.status-vendor{--card-accent:var(--amber);}
  .card.status-workshop{--card-accent:var(--violet);}
  .card.status-important{--card-accent:var(--crimson);}
  .card.status-maint{--card-accent:var(--rose);}
  .pin{
    position:absolute; top:16px;
    width:18px; height:18px; border-radius:50%;
    background:var(--surface); border:3px solid var(--primary);
    z-index:2;
  }
  html[dir="rtl"] .pin{ right:-44px; left:auto; }
  html[dir="ltr"] .pin{ left:-44px; right:auto; }
  .pin.status-visit{border-color:var(--blue);}
  .pin.status-inspection{border-color:var(--amber);}
  .pin.status-wip{border-color:var(--violet);}
  .pin.status-workdone{border-color:var(--forest);}
  .pin.status-contract{border-color:var(--teal);}
  .pin.status-vendor{border-color:var(--amber);}
  .pin.status-workshop{border-color:var(--violet);}
  .pin.status-important{border-color:var(--crimson);}
  .pin.status-maint{border-color:var(--rose);}

  .card-top{display:flex; justify-content:space-between; align-items:center; gap:8px; padding-bottom:0; border-bottom:none;}
  .card-name{font-family:var(--font-display); font-size:16px; font-weight:700; letter-spacing:-0.01em; color:var(--ink);}
  .card-customer{font-size:13px; color:var(--ink-soft); margin-top:3px;}
  .card-note{font-size:13px; color:var(--ink); margin-top:6px; padding:8px 10px; background:#FAFCF9; border:1px solid var(--border); border-radius:8px; white-space:pre-wrap; word-break:break-word;}
  .card-details{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .card-details.open{max-height:600px; padding-top:12px; margin-top:12px; border-top:1px solid var(--border);}
  .chevron{transition:transform .2s ease; color:var(--ink-soft); flex-shrink:0;}
  .chevron.open{transform:rotate(180deg);}
  .badge{
    font-size:11px; font-weight:700; letter-spacing:0.02em; padding:5px 12px; border-radius:20px;
    white-space:nowrap; border:none; font-family:inherit; cursor:pointer;
  }
  .badge.status-new{background:var(--primary-tint); color:var(--primary-dark);}
  .badge.status-visit{background:var(--blue-tint); color:#20406E;}
  .badge.status-inspection{background:var(--amber-tint); color:#8A5A15;}
  .badge.status-wip{background:var(--violet-tint); color:#4A3577;}
  .badge.status-workdone{background:var(--forest-tint); color:#1F5230;}
  .badge.status-contract{background:var(--teal-tint); color:#12525C;}
  .badge.status-vendor{background:var(--amber-tint); color:#7A5108;}
  .badge.status-workshop{background:var(--violet-tint); color:#453275;}
  .badge.status-important{background:var(--crimson-tint); color:#7A1727;}
  .badge.status-maint{background:var(--rose-tint); color:#8C2E27;}

  .card-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .icon-btn{
    display:flex; align-items:center; gap:6px;
    padding:8px 12px; border-radius:9px; border:1px solid var(--border);
    background:#FAFBFC; color:var(--ink); font-size:12.5px; font-weight:500; font-family:inherit;
    cursor:pointer; text-decoration:none; transition:background .12s ease, border-color .12s ease;
  }
  .icon-btn:hover{background:var(--bg); border-color:#CBD5E0;}
  .icon-btn.primary{background:var(--primary-tint); border-color:var(--primary-tint); color:var(--primary-dark); font-weight:700;}
  .icon-btn.primary:hover{background:#D7E8E3;}
  .icon-btn.danger{color:var(--rose);}
  .icon-btn svg{width:14px; height:14px;}

  /* phone contact popup */
  .phone-wrap{position:relative; display:inline-block;}
  .phone-menu{
    display:none; position:absolute; bottom:calc(100% + 6px);
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); padding:6px; z-index:10; min-width:150px;
  }
  html[dir="ltr"] .phone-menu{ left:0; }
  html[dir="rtl"] .phone-menu{ right:0; }
  .phone-menu.open{display:flex; flex-direction:column; gap:2px;}
  .phone-menu-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:8px; text-decoration:none;
    color:var(--ink); font-size:13.5px; font-family:inherit;
  }
  .phone-menu-item:hover{background:var(--primary-tint);}
  .phone-menu-item svg{width:15px; height:15px; flex-shrink:0;}
  .phone-menu-item.whatsapp{color:#1F8A4C;}
  .phone-menu-item.call{color:var(--blue);}

  /* PIN / confirmation modals */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(18,38,32,0.45);
    align-items:center; justify-content:center; z-index:100; padding:20px;
    box-sizing:border-box;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--surface); border-radius:14px; padding:16px;
    width:100%; max-width:260px; box-shadow:var(--shadow);
    box-sizing:border-box; margin:auto;
  }
  .modal-title{
    font-family:var(--font-display); font-weight:700; font-size:14px;
    line-height:1.35; margin-bottom:12px; color:var(--ink); text-align:center;
    word-break:break-word;
  }
  .modal-box input{
    width:100%; padding:10px; border:1px solid var(--border); border-radius:10px;
    font-family:inherit; font-size:18px; letter-spacing:5px; text-align:center;
    background:#FAFCF9; color:var(--ink); outline:none; margin-bottom:10px;
    box-sizing:border-box;
  }
  .modal-box input:focus{border-color:var(--primary);}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{
    flex:1; padding:9px 10px; border-radius:9px; font-family:inherit;
    font-size:13px; font-weight:600; cursor:pointer; min-width:0;
  }
  .modal-actions .btn-save{border:none; background:var(--primary); color:#fff;}
  .modal-actions .btn-cancel{border:1px solid var(--border); background:#fff; color:var(--ink-soft); font-weight:500;}

  /* keep modals compact on tablets/laptops too - don't let them grow */
  @media (min-width:481px){
    .modal-box{max-width:240px; padding:18px;}
    .modal-title{font-size:14.5px;}
  }
  @media (max-width:340px){
    .modal-box{max-width:220px; padding:14px;}
    .modal-title{font-size:13px; margin-bottom:10px;}
    .modal-actions button{padding:8px; font-size:12.5px;}
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--primary-dark); color:#fff; padding:11px 20px;
    border-radius:30px; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,0.2);
    opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1; bottom:34px;}

  .tag-buttons{display:flex; flex-wrap:wrap; gap:6px;}
  .tag-btn{
    font-size:7px; line-height:1; padding:5px 8px; border-radius:20px;
    border:1px solid var(--line, #D8DEE6); background:var(--surface); color:var(--ink-soft);
    cursor:pointer; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
    transition:all .15s ease;
  }
  .tag-btn.active{
    background:var(--primary); border-color:var(--primary); color:#fff;
  }
  .tag-chip{
    font-size:7px; line-height:1; padding:3px 7px; border-radius:20px;
    font-weight:700; letter-spacing:.02em; text-transform:uppercase;
    background:var(--primary-dark, var(--primary)); color:#fff; display:inline-block;
  }
  .card-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px;}
</style>
</head>

      <div>
        <h1 class="title" id="tTitle">My Location Diary</h1>
        <p class="subtitle" id="tSubtitle">Save, search and share your customer locations</p>
      </div>
    </div>
    <div class="lang-switch">
      <button id="btnEn" class="active" onclick="setLang('en')">EN</button>
      <button id="btnAr" onclick="setLang('ar')">AR</button>
    </div>
  </header>

  <div class="search-bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="searchInput" type="text" placeholder="Search by name, customer or status...">
  </div>

  <div class="tag-buttons" id="tagFilterBar" style="margin:0 16px 10px;">
    <button type="button" class="tag-btn" data-tag="ai_vendors" onclick="filterByTag('ai_vendors')" id="filterBtnAi">Vendor's</button>
    <button type="button" class="tag-btn" data-tag="workshops" onclick="filterByTag('workshops')" id="filterBtnWorkshops">Workshops</button>
    <button type="button" class="tag-btn" data-tag="important" onclick="filterByTag('important')" id="filterBtnImportant">Important</button>
  </div>

  <button class="add-toggle" id="addToggleBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    <span id="tAddBtn">Save New Location</span>
  </button>

  <div class="panel" id="formPanel">
    <div class="field">
      <label id="tFieldTags">Tags</label>
      <div class="tag-buttons">
        <button type="button" class="tag-btn" data-tag="ai_vendors" onclick="toggleTag('ai_vendors')" id="tagBtnAi">Vendor's</button>
        <button type="button" class="tag-btn" data-tag="workshops" onclick="toggleTag('workshops')" id="tagBtnWorkshops">Workshops</button>
        <button type="button" class="tag-btn" data-tag="important" onclick="toggleTag('important')" id="tagBtnImportant">Important</button>
      </div>
    </div>
    <div class="field">
      <label id="tFieldName">Location Name</label>
      <input id="inputName" type="text" placeholder="e.g. Shop No. 5, Main Bazaar">
    </div>
    <div class="field">
      <label id="tFieldCustomer">Customer Name</label>
      <input id="inputCustomer" type="text" placeholder="Enter customer name">
    </div>
    <div class="field">
      <label id="tFieldPhone">Customer Contact Number</label>
      <input id="inputPhone" type="tel" placeholder="+92 300 1234567">
    </div>
    <div class="field">
      <label id="tFieldLink">Location Link (paste Google Maps link)</label>
      <input id="inputLink" type="url" placeholder="https://maps.google.com/...">
    </div>
    <div class="field">
      <label id="tFieldNote">Note</label>
      <textarea id="inputNote" rows="3" placeholder="Add any note about this location..."></textarea>
    </div>
    <div class="field">
      <label id="tFieldStatus">Status</label>
      <select id="inputStatus">
        <option value="new_site" id="optNewSite">New Site</option>
        <option value="visit" id="optVisit">Visit</option>
        <option value="inspection" id="optInspection">Inspection</option>
        <option value="work_in_progress" id="optWip">Work in Progress</option>
        <option value="work_done" id="optWorkDone">Work Done</option>
        <option value="contract" id="optContract">Contract</option>
        <option value="vendor" id="optVendor">Vendor's</option>
        <option value="workshop" id="optWorkshop">Workshops</option>
        <option value="important" id="optImportant">Important</option>
        <option value="extinguisher_maintenance" id="optMaint">Extinguisher Maintenance</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-save" id="saveBtn">Save</button>
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="route" id="routeList"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="pinOverlay">
  <div class="modal-box">
    <div class="modal-title" id="tPinTitle">Enter code to delete</div>
    <input type="password" id="pinInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="••••">
    <div class="modal-actions">
      <button class="btn-save" id="pinConfirmBtn">Confirm</button>
      <button class="btn-cancel" id="pinCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statusConfirmOverlay">
  <div class="modal-box">
    <div class="modal-title" id="statusConfirmText">Change status?</div>
    <div class="modal-actions">
      <button class="btn-save" id="statusConfirmBtn">Confirm</button>
      <button class="btn-cancel" id="statusConfirmCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'locations';
const LANG_KEY = 'lang_pref';
let locations = [];
let editingId = null;
let lang = 'en';
let selectedTags = [];
let activeTagFilter = null;
let expandedIds = new Set();

function toggleExpand(id){
  if(expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  render();
}
const ALL_TAGS = ['ai_vendors','workshops','important'];

function toggleTag(tag){
  const idx = selectedTags.indexOf(tag);
  if(idx>-1) selectedTags.splice(idx,1);
  else selectedTags.push(tag);
  syncTagButtons();
}

function syncTagButtons(){
  document.querySelectorAll('#formPanel .tag-btn').forEach(btn=>{
    btn.classList.toggle('active', selectedTags.includes(btn.dataset.tag));
  });
}

function filterByTag(tag){
  activeTagFilter = (activeTagFilter === tag) ? null : tag;
  document.querySelectorAll('#tagFilterBar .tag-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tag === activeTagFilter);
  });
  render();
}

function uid(){ return 'loc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

// Detects Arabic-script text so it can render in Cairo even when the
// interface language itself is set to English.
function isArabicText(str){
  return /[\u0600-\u06FF]/.test(str||'');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function applyLang(){
  const t = T[lang];
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang==='ar' ? 'rtl' : 'ltr');
  document.title = t.title;

  document.getElementById('tTitle').textContent = t.title;
  document.getElementById('tSubtitle').textContent = t.subtitle;
  document.getElementById('searchInput').placeholder = t.searchPlaceholder;
  document.getElementById('tAddBtn').textContent = editingId ? t.editBtnLabel : t.addBtn;
  document.getElementById('tFieldName').textContent = t.fieldName;
  document.getElementById('inputName').placeholder = t.fieldNamePh;
  document.getElementById('tFieldTags').textContent = t.fieldTags;
  document.getElementById('tagBtnAi').textContent = t.tagLabels.ai_vendors;
  document.getElementById('tagBtnWorkshops').textContent = t.tagLabels.workshops;
  document.getElementById('tagBtnImportant').textContent = t.tagLabels.important;
  document.getElementById('filterBtnAi').textContent = t.tagLabels.ai_vendors;
  document.getElementById('filterBtnWorkshops').textContent = t.tagLabels.workshops;
  document.getElementById('filterBtnImportant').textContent = t.tagLabels.important;
  document.getElementById('tFieldCustomer').textContent = t.fieldCustomer;
  document.getElementById('inputCustomer').placeholder = t.fieldCustomerPh;
  document.getElementById('tFieldPhone').textContent = t.fieldPhone;
  document.getElementById('inputPhone').placeholder = t.fieldPhonePh;
  document.getElementById('tFieldLink').textContent = t.fieldLink;
  document.getElementById('inputLink').placeholder = t.fieldLinkPh;
  document.getElementById('tFieldNote').textContent = t.fieldNote;
  document.getElementById('inputNote').placeholder = t.fieldNotePh;
  document.getElementById('tFieldStatus').textContent = t.fieldStatus;
  document.getElementById('optNewSite').textContent = t.statusNewSite;
  document.getElementById('optVisit').textContent = t.statusVisit;
  document.getElementById('optInspection').textContent = t.statusInspection;
  document.getElementById('optWip').textContent = t.statusWip;
  document.getElementById('optWorkDone').textContent = t.statusWorkDone;
  document.getElementById('optContract').textContent = t.statusContract;
  document.getElementById('optVendor').textContent = t.statusVendor;
  document.getElementById('optWorkshop').textContent = t.statusWorkshop;
  document.getElementById('optImportant').textContent = t.statusImportant;
  document.getElementById('optMaint').textContent = t.statusMaint;
  document.getElementById('saveBtn').textContent = editingId ? t.update : t.save;
  document.getElementById('cancelBtn').textContent = t.cancel;
  document.getElementById('tPinTitle').textContent = t.pinTitle;
  document.getElementById('pinConfirmBtn').textContent = t.confirm;
  document.getElementById('pinCancelBtn').textContent = t.cancel;

  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');

  render();
}

async function setLang(newLang){
  lang = newLang;
  applyLang();
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
}

async function loadLang(){
  try{
    const val = localStorage.getItem(LANG_KEY);
    if(val === 'en' || val === 'ar') lang = val;
  }catch(e){}
}

async function loadLocations(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    locations = raw ? JSON.parse(raw) : [];
  }catch(e){
    locations = [];
  }
}

async function saveLocations(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(locations));
  }catch(e){
    showToast(T[lang].toastSaveFail);
  }
}

function openForm(loc){
  editingId = loc ? loc.id : null;
  selectedTags = loc && Array.isArray(loc.tags) ? [...loc.tags] : [];
  syncTagButtons();
  document.getElementById('inputName').value = loc ? loc.name : '';
  document.getElementById('inputName').classList.toggle('ar-text', isArabicText(loc && loc.name));
  document.getElementById('inputCustomer').value = loc ? loc.customer : '';
  document.getElementById('inputCustomer').classList.toggle('ar-text', isArabicText(loc && loc.customer));
  document.getElementById('inputPhone').value = loc ? (loc.phone || '') : '';
  document.getElementById('inputLink').value = loc ? loc.link : '';
  document.getElementById('inputNote').value = loc ? (loc.note || '') : '';
  document.getElementById('inputNote').classList.toggle('ar-text', isArabicText(loc && loc.note));
  document.getElementById('inputStatus').value = loc ? loc.status : 'new_site';
  document.getElementById('formPanel').classList.add('open');
  document.getElementById('saveBtn').textContent = loc ? T[lang].update : T[lang].save;
  document.getElementById('tAddBtn').textContent = loc ? T[lang].editBtnLabel : T[lang].addBtn;
  document.getElementById('inputName').focus();
}

function closeForm(){
  document.getElementById('formPanel').classList.remove('open');
  editingId = null;
  selectedTags = [];
  syncTagButtons();
  document.getElementById('tAddBtn').textContent = T[lang].addBtn;
}

document.getElementById('addToggleBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('formPanel');
  if(panel.classList.contains('open') && !editingId){ closeForm(); }
  else openForm(null);
});
document.getElementById('cancelBtn').addEventListener('click', closeForm);

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('inputName').value.trim();
  const customer = document.getElementById('inputCustomer').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();
  const link = document.getElementById('inputLink').value.trim();
  const note = document.getElementById('inputNote').value.trim();
  const status = document.getElementById('inputStatus').value;

  if(!name || !link){
    showToast(T[lang].toastRequired);
    return;
  }

  if(editingId){
    const idx = locations.findIndex(l=>l.id===editingId);
    if(idx>-1){
      locations[idx] = {...locations[idx], name, customer, phone, link, note, status, tags:[...selectedTags]};
    }
    showToast(T[lang].toastUpdated);
  }else{
    locations.unshift({id:uid(), name, customer, phone, link, note, status, tags:[...selectedTags], createdAt:Date.now()});
    showToast(T[lang].toastSaved);
  }
  await saveLocations();
  closeForm();
  render();
});

async function deleteLocation(id){
  locations = locations.filter(l=>l.id!==id);
  await saveLocations();
  render();
  showToast(T[lang].toastDeleted);
}

let pendingDeleteId = null;

function requestDelete(id){
  pendingDeleteId = id;
  document.getElementById('pinInput').value = '';
  document.getElementById('pinOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('pinInput').focus(), 50);
}

function closePinModal(){
  document.getElementById('pinOverlay').classList.remove('open');
  pendingDeleteId = null;
}

document.getElementById('pinConfirmBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('pinInput').value.trim();
  if(val === '1234' && pendingDeleteId){
    const id = pendingDeleteId;
    closePinModal();
    await deleteLocation(id);
  }else{
    showToast(T[lang].toastWrongCode);
  }
});
document.getElementById('pinCancelBtn').addEventListener('click', closePinModal);
document.getElementById('pinOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'pinOverlay') closePinModal();
});
document.getElementById('pinInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('pinConfirmBtn').click();
});

function openWhatsApp(phone){
  const num = cleanPhone(phone);
  if(!num) return;
  const ua = navigator.userAgent || '';
  const isAndroid = /Android/i.test(ua);
  const fallback = 'https://wa.me/' + num;
  if(isAndroid){
    // Try WhatsApp Business first; if it's not installed, Android falls back to wa.me automatically
    window.location.href = 'intent://send?phone=' + num + '#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
  } else {
    window.open(fallback, '_blank', 'noopener');
  }
}

function cleanPhone(str){
  return (str||'').replace(/[^\d+]/g,'').replace(/^\+/,'');
}

const STATUS_ORDER = ['new_site','visit','inspection','work_in_progress','work_done','contract','vendor','workshop','important','extinguisher_maintenance'];
const STATUS_LABEL_KEY = {
  new_site:'statusNewSite', visit:'statusVisit', inspection:'statusInspection',
  work_in_progress:'statusWip', work_done:'statusWorkDone', contract:'statusContract',
  vendor:'statusVendor', workshop:'statusWorkshop', important:'statusImportant',
  extinguisher_maintenance:'statusMaint'
};
let pendingStatusChange = null; // {id, next}

function cycleStatus(id){
  const loc = locations.find(l=>l.id===id);
  if(!loc) return;
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(loc.status)+1) % STATUS_ORDER.length];
  pendingStatusChange = {id, next};
  const t = T[lang];
  const nextLabel = t[STATUS_LABEL_KEY[next]];
  document.getElementById('statusConfirmText').textContent = `${t.statusConfirmText} "${nextLabel}"${t.statusConfirmSuffix}`;
  document.getElementById('statusConfirmOverlay').classList.add('open');
}

function closeStatusConfirmModal(){
  document.getElementById('statusConfirmOverlay').classList.remove('open');
  pendingStatusChange = null;
}

document.getElementById('statusConfirmBtn').addEventListener('click', ()=>{
  if(!pendingStatusChange) return;
  const loc = locations.find(l=>l.id===pendingStatusChange.id);
  if(loc){
    loc.status = pendingStatusChange.next;
    saveLocations();
    render();
  }
  closeStatusConfirmModal();
});
document.getElementById('statusConfirmCancelBtn').addEventListener('click', closeStatusConfirmModal);
document.getElementById('statusConfirmOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'statusConfirmOverlay') closeStatusConfirmModal();
});

async function shareLocation(loc){
  const t = T[lang];
  const label = t['status'+loc.status.charAt(0).toUpperCase()+loc.status.slice(1)];
  const text = `${loc.name}\n${t.customerLabel}: ${loc.customer || '—'}${loc.note ? `\n${t.fieldNote}: ${loc.note}` : ''}\n${loc.link}`;
  if(navigator.share){
    try{
      await navigator.share({title: loc.name, text: text, url: loc.link});
      return;
    }catch(e){ /* cancelled, fall through */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast(t.toastCopied);
  }catch(e){
    showToast(t.toastShareFail);
  }
}

function render(){
  const t = T[lang];
  const statusLabel = {
    new_site:t.statusNewSite, visit:t.statusVisit, inspection:t.statusInspection,
    work_in_progress:t.statusWip, work_done:t.statusWorkDone, contract:t.statusContract,
    vendor:t.statusVendor, workshop:t.statusWorkshop, important:t.statusImportant,
    extinguisher_maintenance:t.statusMaint
  };
  const statusClass = {
    new_site:'status-new', visit:'status-visit', inspection:'status-inspection',
    work_in_progress:'status-wip', work_done:'status-workdone', contract:'status-contract',
    vendor:'status-vendor', workshop:'status-workshop', important:'status-important',
    extinguisher_maintenance:'status-maint'
  };

  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = locations.filter(l=>{
    if(!query) return true;
    return (l.name||'').toLowerCase().includes(query)
      || (l.customer||'').toLowerCase().includes(query)
      || (statusLabel[l.status]||'').toLowerCase().includes(query);
  });

  const TAG_STATUS_MAP = {ai_vendors:'vendor', workshops:'workshop', important:'important'};
  if(activeTagFilter){
    const equivStatus = TAG_STATUS_MAP[activeTagFilter];
    filtered = filtered.filter(l =>
      (l.tags && l.tags.includes(activeTagFilter)) || l.status === equivStatus
    );
  }

  const stats = document.getElementById('statsBar');
  const counts = {new_site:0, visit:0, inspection:0, work_in_progress:0, work_done:0, contract:0, vendor:0, workshop:0, important:0, extinguisher_maintenance:0};
  locations.forEach(l=>{ if(counts[l.status]!==undefined) counts[l.status]++; });
  stats.innerHTML = `
    <div class="stat"><div class="num">${locations.length}</div><div class="lbl">${t.statTotal}</div></div>
    <div class="stat"><div class="num">${counts.work_in_progress}</div><div class="lbl">${t.statWip}</div></div>
    <div class="stat"><div class="num">${counts.work_done}</div><div class="lbl">${t.statWorkDone}</div></div>
  `;

  const list = document.getElementById('routeList');
  if(filtered.length === 0){
    const msg = activeTagFilter ? (t.emptyTagFilter || t.emptySearch) : (locations.length===0 ? t.emptyNone : t.emptySearch);
    list.innerHTML = `<div class="empty"><div class="big">📍</div>${msg}</div>`;
    return;
  }

  list.innerHTML = filtered.map(loc => {
    const isOpen = expandedIds.has(loc.id);
    return `
    <div class="card">
      <div class="pin ${statusClass[loc.status]}"></div>
      <div class="card-top" onclick="toggleExpand('${loc.id}')" style="cursor:pointer;">
        <div class="card-name${isArabicText(loc.name) ? ' ar-text' : ''}">${escapeHtml(loc.name)}</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="badge ${statusClass[loc.status]}" onclick="event.stopPropagation(); cycleStatus('${loc.id}')" title="${t.cycleTitle}">${statusLabel[loc.status]}</button>
          <svg class="chevron${isOpen ? ' open' : ''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="card-details${isOpen ? ' open' : ''}">
        ${loc.tags && loc.tags.length ? `<div class="card-tags">${loc.tags.map(tg=>`<span class="tag-chip">${escapeHtml(t.tagLabels[tg] || tg)}</span>`).join('')}</div>` : ''}
        <div class="card-customer${isArabicText(loc.customer) ? ' ar-text' : ''}">${escapeHtml(loc.customer || t.noCustomer)}</div>
        ${loc.note ? `<div class="card-note${isArabicText(loc.note) ? ' ar-text' : ''}">${escapeHtml(loc.note)}</div>` : ''}
        <div class="card-actions">
        <a class="icon-btn primary" href="${escapeAttr(loc.link)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4.5 8-11a8 8 0 1 0-16 0c0 6.5 8 11 8 11Z"/><circle cx="12" cy="11" r="3"/></svg>
          ${t.viewLocation}
        </a>
        <button class="icon-btn" onclick='shareLocation(${JSON.stringify(loc).replace(/'/g,"&#39;")})'>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/></svg>
          ${t.share}
        </button>
        ${loc.phone ? `
        <button class="icon-btn" onclick="openWhatsApp('${escapeAttr(loc.phone)}')" title="${t.whatsapp}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.29-.15-1.7-.84-1.97-.93-.26-.1-.46-.15-.65.15-.2.29-.75.93-.92 1.12-.17.2-.34.22-.63.07-.29-.15-1.22-.45-2.32-1.43-.86-.76-1.44-1.71-1.6-2-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.48.1-.2.05-.37-.02-.51-.07-.15-.65-1.58-.9-2.16-.24-.57-.48-.5-.65-.5-.17 0-.37-.02-.56-.02-.2 0-.51.07-.78.37-.26.29-1.02 1-1.02 2.42 0 1.43 1.04 2.82 1.19 3.01.15.2 2.05 3.13 4.96 4.39.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.11.55-.08 1.7-.7 1.94-1.37.24-.68.24-1.26.17-1.38-.07-.12-.26-.2-.55-.34z"/><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.42 1.26 4.86L2 22l5.32-1.28a9.9 9.9 0 0 0 4.72 1.2h.01c5.5 0 9.96-4.46 9.96-9.96S17.55 2 12.04 2zm0 18.1h-.01a8.14 8.14 0 0 1-4.15-1.14l-.3-.18-3.09.74.75-3.01-.19-.31a8.13 8.13 0 0 1-1.27-4.38c0-4.5 3.66-8.15 8.16-8.15 2.18 0 4.22.85 5.76 2.39a8.09 8.09 0 0 1 2.39 5.76c0 4.5-3.66 8.28-8.05 8.28z"/></svg>
          ${t.contact}
        </button>
        <a class="icon-btn" href="tel:${escapeAttr(loc.phone)}" title="${t.call}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        </a>` : ''}
        <button class="icon-btn" onclick='openForm(${JSON.stringify(loc).replace(/'/g,"&#39;")})'>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          ${t.edit}
        </button>
        <button class="icon-btn danger" onclick="requestDelete('${loc.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V6h8Z"/></svg>
          ${t.delete}
        </button>
        </div>
      </div>
    </div>
  `;}).join('');
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  return (str||'').replace(/"/g,'&quot;');
}

document.getElementById('searchInput').addEventListener('input', render);

function bindAutoArabicFont(inputEl){
  inputEl.addEventListener('input', ()=>{
    inputEl.classList.toggle('ar-text', isArabicText(inputEl.value));
  });
}
bindAutoArabicFont(document.getElementById('inputName'));
bindAutoArabicFont(document.getElementById('inputCustomer'));
bindAutoArabicFont(document.getElementById('inputNote'));

(async function init(){
  await loadLang();
  await loadLocations();
  applyLang();
})();
